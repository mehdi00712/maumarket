<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | MauMarket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Navigation is injected automatically by nav.js -->

<main class="dashboard-page">

    <!-- ================= HERO ================= -->

    <section class="dashboard-hero">

        <div class="dashboard-hero-left">

            <span
                id="roleBadge"
                class="hero-badge">

                Loading...

            </span>

            <h1 id="welcome">

                Welcome to MauMarket

            </h1>

            <p id="status">

                Loading your dashboard...

            </p>

        </div>

        <div class="dashboard-hero-right">

            <div class="dashboard-hero-card">

                <h3>

                    MauMarket

                </h3>

                <p>

                    Your complete marketplace control centre.

                </p>

            </div>

        </div>

    </section>

    <!-- ================= OVERVIEW ================= -->

    <section class="dashboard-section">

        <div class="dashboard-section-title">

            <div>

                <h2>

                    Overview

                </h2>

                <p>

                    Live statistics from your account.

                </p>

            </div>

        </div>

        <section
            id="quickStats"
            class="dashboard-stats">

            <!-- dashboard.js -->

        </section>

    </section>

    <!-- ================= MENU ================= -->

    <section class="dashboard-section">

        <div class="dashboard-section-title">

            <div>

                <h2>

                    Dashboard Menu

                </h2>

                <p>

                    The options below change automatically depending on your account type.

                </p>

            </div>

        </div>

        <div
            id="actions"
            class="dashboard-grid">

            <!-- Generated by dashboard.js -->

        </div>

    </section>

</main>

<script type="module" src="js/nav.js?v=4.0"></script>
<script type="module" src="js/dashboard.js?v=6.0"></script>

</body>
</html>
